openapi: 3.0.3
info:
  title: Catalog API
  version: '1.0'
paths:
  /books:
    get:
      parameters:
        - name: author
          in: query
          schema: {type: string}
        - name: isbn
          required: true
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Matching books
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
