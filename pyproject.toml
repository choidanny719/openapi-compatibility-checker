[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-compatibility-checker"
version = "0.1.0"
description = "Check OpenAPI contracts for changes that affect existing clients"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "openapi-spec-validator>=0.7.2,<0.8"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
openapi-check = "apicheck.cli:main"

[tool.setuptools]
packages = ["apicheck"]
